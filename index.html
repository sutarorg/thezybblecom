<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Zybble — Find the businesses you need. Turn them into usable leads.</title>

    <!-- Primary SEO -->
    <meta name="description" content="Zybble turns one plain-language request into an organized business lead list. Describe the businesses you want, get structured lead data, analyze it with AI, and export it as CSV." />
    <meta name="application-name" content="Zybble" />
    <meta name="robots" content="index, follow, max-image-preview:large" />
    <link rel="canonical" href="https://zybble.app/" />
    <meta name="theme-color" content="#fbfbf8" />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Zybble — Find the businesses you need." />
    <meta property="og:description" content="Describe the leads you want in plain language. Zybble finds the businesses, organizes the data, and turns it into a list you can work." />
    <meta property="og:url" content="https://zybble.app/" />
    <meta property="og:site_name" content="Zybble" />

    <!-- Twitter/X -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Zybble — Find the businesses you need." />
    <meta name="twitter:description" content="Natural-language business discovery, structured lead data, AI lead intelligence, and one-click CSV export." />

    <!-- Icons -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Inter+Tight:ital,wght@0,300;0,400;0,500;0,600;0,700;1,500&display=swap"
      rel="stylesheet"
    />

    <!-- The one landscape used across the whole product story -->
    <link rel="preconnect" href="https://i.ibb.co" crossorigin />
    <link
      rel="preload"
      as="image"
      href="https://i.ibb.co/WpHKfrCy/hero-main.webp"
      fetchpriority="high"
    />

    <!-- Structured data -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "SoftwareApplication",
        "name": "Zybble",
        "applicationCategory": "BusinessApplication",
        "operatingSystem": "Web",
        "description": "AI-powered business lead discovery. Describe the businesses you want in plain language, organize them into lead lists, enrich the data, and export it.",
        "url": "https://zybble.app/",
        "offers": {
          "@type": "Offer",
          "price": "0",
          "priceCurrency": "USD",
          "description": "Free plan with 50 leads per month"
        },
        "publisher": {
          "@type": "Organization",
          "name": "Zybble",
          "url": "https://zybble.app/"
        }
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
